apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker-alerts
    folder: Order Tracker
    interval: 1m
    rules:
      - uid: order-tracker-5xx
        title: 5xx_errors_alert
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum by (http_route) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          __dashboardUid__: order-tracker-observability
          __panelId__: "2"
          summary: "5xx errors detected for {{ $labels.http_route }}"
          description: "Server errors in the last 5 minutes for endpoint {{ $labels.http_route }}. Investigate the linked Order Tracker dashboard."
          dashboard_url: "http://localhost:3000/d/order-tracker-observability/order-tracker-observability"
        labels:
          severity: critical
          endpoint: "{{ $labels.http_route }}"
        notification_settings:
          receiver: incident-responder
        isPaused: false
